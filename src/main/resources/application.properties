spring.application.name=Ayurveda_Management

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ayurveda_management
spring.datasource.username=odyssey
spring.datasource.password=odyssey
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.connection-test-query=SELECT 1

spring.security.user.name=ody
spring.security.user.password=ody

# JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
logging.level.org.thymeleaf=DEBUG

logging.level.org.springframework.security=DEBUG

file.upload-dir=/absolute/path/to/uploads
spring.web.resources.static-locations=classpath:/static/, file:/path/to/your/images/

#spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/images/

spring.main.allow-circular-references=true
spring.thymeleaf.mode=HTML





