<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Ayurweda Management System - Login" />
  <title>Ayurweda Management System</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/signin.css}">
  <link rel="stylesheet" th:href="@{/css/index.css}">
</head>

<body>
<div id="root">

  <div class="page-container">
    <!-- Navbar component -->
    <div class="signin-container">
      <main class="signin-main">
        <div class="signin-card">
          <div class="signin-form">
            <h2>LOG IN</h2>

            <!-- Check for login error -->
            <div th:if="${param.error}">
              <div class="alert alert-danger col-xs-offset-1 col-xs-10">
                Invalid username and password.
              </div>
            </div>

            <!-- Check for logout -->
            <div th:if="${param.logout}">
              <div class="alert alert-success col-xs-offset-1 col-xs-10">
                You have been logged out.
              </div>
            </div>

            <form action="" th:action="@{/authenticateTheUser}" method="POST">
              <input
                      type="text"
                      name="username"
                      placeholder="Username"
              />
              <input
                      type="password"
                      name="password"
                      placeholder="Password"
              />
              <button type="submit" class="signin-button">LOG IN</button>
            </form>
          </div>
          <div class="signin-image">
            <img src="/images/login.png" />
          </div>
        </div>
      </main>
    </div>

  </div>

</div>

</body>
</html>
