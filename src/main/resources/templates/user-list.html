<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">User Accounts</h2>

    <div class="d-flex justify-content-between mb-3">
        <a th:href="@{/user/showForm}" class="btn btn-success">Add New User</a>
        <a th:href="@{/profile}" class="btn btn-primary">View Profile</a> <!-- View Profile button -->
        <a th:href="@{/logout}" class="btn btn-danger"
           onclick="return confirm('Are you sure you want to Logout?');">Logout</a> <!-- Logout button -->
    </div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>#</th>
            <th>Staff ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Status</th>
            <th>Last Login</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempUser : ${users}">
            <td th:text="${tempUser.id}"></td>
            <td th:text="${tempUser.staff.id}"></td>
            <td th:text="${tempUser.username}"></td>
            <td th:text="${tempUser.role.authority}"></td>
            <td th:text="${tempUser.status}"></td>
            <td th:text="${tempUser.lastLogin}"></td>
<!--            <td th:text="${#dates.format(tempUser.last_login, 'yyyy-MM-dd HH:mm:ss')}"></td>-->
<!--            <td th:text="${tempUser.last_login != null ? #dates.format(tempUser.last_login, 'yyyy-MM-dd HH:mm:ss') : 'N/A'}"></td>-->

            <td>
                <a th:href="@{/user/showForm(userId=${tempUser.id})}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{/user/delete(userId=${tempUser.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this user?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
