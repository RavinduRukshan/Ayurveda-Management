<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ayurweda Management System - Login" />
    <title>Ayurveda Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/admin/AdminDashboard.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/Sidebar.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/admin/dashboard.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/Navbar.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/MainContent.css}">
</head>

<body>
<div id="root">
    <div class="page-container">
        <!-- Navbar------------------------------------------------------------------------------------------------- -->
        <nav class="navbar navbar-expand-lg fixed-top" style="background-color: #24757e; color: #ffffff">
            <div class="container-fluid">
                <div class="d-flex align-items-center flex-wrap flex-lg-nowrap w-100 justify-content-end">
                    <ul class="navbar-nav d-flex flex-row w-auto mt-2 mt-lg-0">
                        <li class="nav-items">
                            <div class="dropdown">
                                <button
                                        class="nav-link text-white dropdown-toggle"
                                        style="background: none; border: none"
                                        id="navbarDropdown"
                                        data-bs-toggle="dropdown"
                                        aria-expanded="false"
                                >
                                    <img
                                            src="/images/user.png"
                                            alt="user"
                                            style="width: 37px; padding-right: 9px; margin-right: 5px"
                                    />
                                    <img
                                            src="/images/arrow.png"
                                            alt="arrow"
                                            style="width: 15px"
                                    />
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                    <li><a class="dropdown-item" href="#profile">Profile</a></li>
                                    <li><a class="dropdown-item" href="/logout">Logout</a></li>
                                </ul>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>



        <div class="main-content">
            <!-- Sidebar-------------------------------------------------------------------------------------------- -->
            <div class="sidebar">
                <h2>Dashboard</h2>
                <ul>
                    <li><a th:href="@{/treatment/list}"><img src="/images/Dashboard.png" alt="Dashboard" style="width: 25px; margin-right: 10px" /><span>Dashboard</span></a></li>
                    <li><a th:href="@{/patient/list}"><img src="/images/Patients.png" alt="Patients" style="width: 25px; margin-right: 10px" /><span>Patients</span></a></li>
                    <li><a th:href="@{/user/list}"><img src="/images/Patients.png" alt="Users" style="width: 25px; margin-right: 10px" /><span>Users</span></a></li>
                    <li><a th:href="@{/staff/list}"><img src="/images/Patients.png" alt="Staff" style="width: 25px; margin-right: 10px" /><span>Staff</span></a></li>
                </ul>
            </div>

            <!-- Patient View--------------------------------------------------------------------------------------- -->
            <div class="profile-card">
                <div class="profile-card-header">
                    <h4>Details of <span th:text="${patient.name}"></span></h4>
                </div>
                <div class="profile-card-body">
                    <p><strong>ID:</strong> <span th:text="${patient.id}"></span></p>
                    <p><strong>Name:</strong> <span th:text="${patient.name}"></span></p>
                    <p><strong>Age:</strong> <span th:text="${patient.age}"></span></p>
                    <p><strong>Address:</strong> <span th:text="${patient.address}"></span></p>
                    <p><strong>Phone:</strong> <span th:text="${patient.contactNumber}"></span></p>
                    <p><strong>Medical History:</strong> <span th:text="${patient.medicalHistory}"></span></p>
                    <p><strong>Notes:</strong> <span th:text="${patient.notes}"></span></p>
                </div>
            </div>


            <!-- Treatment History -->
            <h4 class="mb-3">Treatment History</h4>
            <table class="table">
                <thead>
                <tr>
                    <th>Sickness</th>
                    <th>Medicine Given</th>
                    <th>Therapy Given</th>
                    <th>Date</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="record : ${treatmentRecords}">
                    <td th:text="${record.sicknessDescription}"></td>
                    <td th:text="${record.medicinePrescribed}"></td>
                    <td th:text="${record.therapyGiven}"></td>
                    <td th:text="${record.treatmentDate}"></td>
                </tr>
                </tbody>
            </table>

            <div class="mt-4">
                <a th:href="@{/patient/list}" class="btn btn-secondary">Back to List</a>
            </div>



        </div>
    </div>



</div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
