<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Treatment Records</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center mb-4">Treatment Records</h1>

    <!-- Date Filter Form -->
    <div class="d-flex justify-content-between mb-3">
        <form th:action="@{/treatment/list}" method="get" class="d-flex">
            <input
                    type="date"
                    name="date"
                    class="form-control me-2"
                    th:value="${selectedDate}"
                    required>
            <button type="submit" class="btn btn-primary">Filter by Date</button>
        </form>
        <a href="/treatment/showFormForAdd" class="btn btn-success">Add New Record</a>
    </div>

    <!-- Table for Treatment Records -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Patient Name</th>
            <th>Treatment Date</th>
            <th>Treatment Time</th>
            <th>Sickness</th>
            <th>Medicine</th>
            <th>Staff Name</th>
            <th>Amount</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="record : ${records}">
            <td th:text="${record.id}"></td>
            <td th:text="${record.patient.name}"></td>
            <td th:text="${record.treatmentDate}"></td>
            <td th:text="${record.treatmentTime}"></td>
            <td th:text="${record.sicknessDescription}"></td>
            <td th:text="${record.medicinePrescribed}"></td>
            <td th:text="${record.staff.name}"></td>
            <td th:text="${record.treatmentAmount}"></td>
            <td>
                <a th:href="@{/treatment/showFormForUpdate(recordId=${record.id})}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{/treatment/delete(recordId=${record.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this record?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
