<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients Page</title>
    <link rel="stylesheet" th:href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        body {
            display: flex;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        .sidebar {
            background-color: #f8f9fa;
            width: 250px;
            padding: 20px;
            height: 100vh;
        }

        .sidebar h2 {
            color: #24757e;
            margin-bottom: 30px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            margin-bottom: 20px;
        }

        .sidebar ul li a {
            text-decoration: none;
            color: #333;
            display: flex;
            align-items: center;
        }

        .sidebar ul li a:hover {
            color: #24757e;
        }

        .content {
            flex-grow: 1;
            padding: 20px;
            background-color: #f4f6f8;
        }

        .navbar {
            z-index: 1000;
        }
    </style>

</head>
<body>
<div class="patients-page-container">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top" style="background-color: #24757e; color: #ffffff;">
        <div class="container-fluid">
            <div class="d-flex align-items-center flex-wrap flex-lg-nowrap w-100 justify-content-end">
                <ul class="navbar-nav d-flex flex-row w-auto mt-2 mt-lg-0">
                    <li class="nav-items">
                        <div class="dropdown">
                            <button
                                    class="nav-link text-white dropdown-toggle"
                                    style="background: none; border: none;"
                                    id="navbarDropdown"
                                    data-bs-toggle="dropdown"
                                    aria-expanded="false"
                            >
                                <img src="/assets/user.png" alt="user" style="width: 37px; padding-right: 9px; margin-right: 5px;">
                                <img src="/assets/arrow.png" alt="arrow" style="width: 15px;">
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="#profile">Profile</a></li>
                                <li>
                                    <button class="dropdown-item" onclick="logout()">Logout</button>
                                </li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li><a href="admin-Dashboard"><img src="/assets/Dashboard.png" alt="Dashboard" style="width: 25px; margin-right: 10px;"><span>Dashboard</span></a></li>
            <li><a href="Patient-page"><img src="/assets/Patients.png" alt="Patients" style="width: 25px; margin-right: 10px;"><span>Patients</span></a></li>
            <li><a href="users-page"><img src="/assets/Patients.png" alt="Users" style="width: 25px; margin-right: 10px;"><span>Users</span></a></li>
            <li><a href="staff-page"><img src="/assets/Patients.png" alt="Users" style="width: 25px; margin-right: 10px;"><span>Staff</span></a></li>
        </ul>
    </div>


    <!-- Content -->
    <div class="patients-content">
        <div class="patients-top-section">
            <div class="patients-actions-container">
                <div class="patients-search-container">
                    <input
                            type="text"
                            placeholder="Search for patients"
                            class="patients-search-bar"
                    />
                    <i class="fas fa-search patients-search-icon"></i>
                </div>
                <button class="patients-add-btn">
                    <i class="fas fa-user-plus"></i> Add New Patient
                </button>
            </div>
        </div>

        <div class="patients-main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <!-- Sidebar content -->
            </aside>

            <div class="patients-table-container">
                <h4>Patients List</h4>
                <table class="patients-table table">
                    <thead>
                    <tr>
                        <th>Patient Id</th>
                        <th>Patient Name</th>
                        <th>Patient Address</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Replace this with data from the backend -->
                    <tr>
                        <td>1</td>
                        <td>John Doe</td>
                        <td>123 Street, City</td>
                        <td>
                            <a href="#" class="btn btn-info btn-sm">View</a>
                            <button class="btn btn-warning btn-sm">Update</button>
                            <button class="btn btn-danger btn-sm">Delete</button>
                        </td>
                    </tr>
                    <!-- Add more rows as needed -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Popup -->
    <div class="patients-popup-overlay-delete" style="display: none;">
        <div class="patients-popup-content-delete">
            <h3 class="delete-text">Are you sure you want to delete this?</h3>
            <div class="confirmation-buttons">
                <button class="btn btn-danger">Yes, Delete</button>
                <button class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Create Patient Popup -->
    <div class="patients-popup-overlay" style="display: none;">
        <div class="patients-popup-content">
            <h3>Patient Registration</h3>
            <form class="patients-popup-form">
                <input type="text" name="name" placeholder="Patient Name" required />
                <input type="number" name="age" placeholder="Age" required />
                <select name="gender" required>
                    <option value="" disabled selected>Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" name="contactNumber" placeholder="Phone Number" required />
                <input type="email" name="email" placeholder="Enter Email" required />
                <textarea name="address" placeholder="Address" required></textarea>
                <textarea name="medicalHistory" placeholder="Medical History"></textarea>
                <input type="date" name="registrationDate" required />
                <textarea name="notes" placeholder="Notes"></textarea>
                <button type="submit" class="btn btn-primary">Register</button>
                <button type="button" class="btn btn-secondary">Close</button>
            </form>
        </div>
    </div>

    <!-- Update Patient Popup -->
    <div class="patients-popup-overlay" style="display: none;">
        <div class="patients-popup-content">
            <h3>Update Patient</h3>
            <form class="patients-popup-form">
                <input type="text" name="name" placeholder="Patient Name" required />
                <input type="number" name="age" placeholder="Age" required />
                <select name="gender" required>
                    <option value="" disabled selected>Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" name="contactNumber" placeholder="Phone Number" required />
                <input type="email" name="email" placeholder="Enter Email" required />
                <textarea name="address" placeholder="Address" required></textarea>
                <textarea name="medicalHistory" placeholder="Medical History"></textarea>
                <input type="date" name="registrationDate" required />
                <textarea name="notes" placeholder="Notes"></textarea>
                <button type="submit" class="btn btn-primary">Update</button>
                <button type="button" class="btn btn-secondary">Close</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
