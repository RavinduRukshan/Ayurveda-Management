<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center" th:text="${staff.id != null ? 'Update Staff' : 'Add New Staff'}"></h2>
    <form th:action="@{/staff/save}" th:object="${staff}" method="post">
        <input type="hidden" th:field="*{id}"> <!-- Hidden field for the id -->
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required>
        </div>
        <div class="mb-3">
            <label for="role" class="form-label">Role</label>
            <select class="form-control" id="role" th:field="*{role}" required>
                <option value="" disabled>Select Role</option>
                <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.roleName}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="contactNumber" class="form-label">Contact Number</label>
            <input type="text" class="form-control" id="contactNumber" th:field="*{contactNumber}" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" required>
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <textarea class="form-control" id="address" th:field="*{address}" required></textarea>
        </div>
        <div class="mb-3">
            <label for="salary" class="form-label">Salary</label>
            <input type="number" class="form-control" id="salary" th:field="*{salary}" required>
        </div>
        <div class="mb-3">
            <label for="hireDate" class="form-label">Hire Date</label>
            <input type="date" class="form-control" id="hireDate" th:field="*{hireDate}" required>
        </div>
        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-control" id="status" th:field="*{status}" required>
                <option value="">Select Status</option>
                <option th:value="${T(com.example.Ayurveda_Management.model.Status).Active}">Active</option>
                <option th:value="${T(com.example.Ayurveda_Management.model.Status).Inactive}">Inactive</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="dispensary" class="form-label">Dispensary</label>
            <select class="form-control" id="dispensary" th:field="*{dispensary}" required>
                <option value="" disabled>Select Dispensary</option>
                <option th:each="dispensary : ${dispensaries}" th:value="${dispensary.id}" th:text="${dispensary.name}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/staff/list" class="btn btn-secondary">Cancel</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
