<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patient Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
<div class="container mt-5">
  <h3 th:text="${patient.id == null ? 'Register Patient' : 'Update Patient'}"></h3>

  <!-- Form to register or update a patient -->
  <form th:action="@{/patient/save}" th:object="${patient}" method="post">
    <div class="mb-3">
      <label for="patient-name" class="form-label">Name</label>
      <input type="text" th:field="*{name}" class="form-control" id="patient-name" placeholder="Enter Patient Name" required />
    </div>

    <div class="mb-3">
      <label for="patient-age" class="form-label">Age</label>
      <input type="number" th:field="*{age}" class="form-control" id="patient-age" placeholder="Enter Patient Age" required />
    </div>

    <div class="mb-3">
      <label for="patient-gender" class="form-label">Gender</label>
      <select th:field="*{gender}" class="form-select" id="patient-gender" required>
        <option value="" disabled selected>Select Gender</option>
        <option th:value="${T(com.example.Ayurveda_Management.model.Gender).Male}">Male</option>
        <option th:value="${T(com.example.Ayurveda_Management.model.Gender).Female}">Female</option>
        <option th:value="${T(com.example.Ayurveda_Management.model.Gender).Other}">Other</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="patient-contact" class="form-label">Contact Number</label>
      <input type="text" th:field="*{contactNumber}" class="form-control" id="patient-contact" placeholder="Enter Contact Number" required />
    </div>

    <div class="mb-3">
      <label for="patient-email" class="form-label">Email</label>
      <input type="email" th:field="*{email}" class="form-control" id="patient-email" placeholder="Enter Email" required />
    </div>

    <div class="mb-3">
      <label for="patient-address" class="form-label">Address</label>
      <textarea th:field="*{address}" class="form-control" id="patient-address" placeholder="Enter Address" required></textarea>
    </div>

    <div class="mb-3">
      <label for="patient-history" class="form-label">Medical History</label>
      <textarea th:field="*{medicalHistory}" class="form-control" id="patient-history" placeholder="Enter Medical History" required></textarea>
    </div>

    <div class="mb-3">
      <label for="patient-registrationDate" class="form-label">Registration Date</label>
      <input type="date" th:field="*{registrationDate}" class="form-control" id="patient-registrationDate" required />
    </div>

    <div class="mb-3">
      <label for="patient-notes" class="form-label">Notes</label>
      <textarea th:field="*{notes}" class="form-control" id="patient-notes" placeholder="Enter Notes"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      <span th:text="${patient.id == null ? 'Register' : 'Update'}"></span>
    </button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
