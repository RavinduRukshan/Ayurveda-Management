<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ayurweda Management System - Login" />
    <title>Ayurveda Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/admin/AdminDashboard.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/Sidebar.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/admin/dashboard.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/Navbar.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/MainContent.css}">
</head>

<body>
<div id="root">
    <div class="page-container">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg fixed-top" style="background-color: #24757e; color: #ffffff">
            <div class="container-fluid">
                <div class="d-flex align-items-center flex-wrap flex-lg-nowrap w-100 justify-content-end">
                    <ul class="navbar-nav d-flex flex-row w-auto mt-2 mt-lg-0">
                        <li class="nav-items">
                            <div class="dropdown">
                                <button
                                        class="nav-link text-white dropdown-toggle"
                                        style="background: none; border: none"
                                        id="navbarDropdown"
                                        data-bs-toggle="dropdown"
                                        aria-expanded="false"
                                >
                                    <img
                                            src="/images/user.png"
                                            alt="user"
                                            style="width: 37px; padding-right: 9px; margin-right: 5px"
                                    />
                                    <img
                                            src="/images/arrow.png"
                                            alt="arrow"
                                            style="width: 15px"
                                    />
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                    <li><a class="dropdown-item" href="#profile">Profile</a></li>
                                    <li><a class="dropdown-item" href="/logout">Logout</a></li>
                                </ul>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>



            <div class="main-content">
                <!-- Sidebar -->
                <div class="sidebar">
                    <h2>Dashboard</h2>
                    <ul>
                        <li><a th:href="@{/treatment/list}"><img src="/images/Dashboard.png" alt="Dashboard" style="width: 25px; margin-right: 10px" /><span>Dashboard</span></a></li>
                        <li><a th:href="@{/patient/list}"><img src="/images/Patients.png" alt="Patients" style="width: 25px; margin-right: 10px" /><span>Patients</span></a></li>
                        <li><a th:href="@{/user/list}"><img src="/images/Patients.png" alt="Users" style="width: 25px; margin-right: 10px" /><span>Users</span></a></li>
                        <li><a th:href="@{/staff/list}"><img src="/images/Patients.png" alt="Staff" style="width: 25px; margin-right: 10px" /><span>Staff</span></a></li>
                    </ul>
                </div>

                <!-- Patient Form -->
                <div class="container my-5">
                    <h1 class="text-center mb-4">Form Patient</h1>

                    <form action="#" th:action="@{/patient/save}"
                          th:object="${patient}" method="POST">
                        <input type="hidden" th:field="*{id}"> <!-- Hidden field for the id -->
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" th:field="*{name}" class="form-control" id="name" required>
                        </div>

                        <div class="mb-3">
                            <label for="age" class="form-label">Age</label>
                            <input type="number" th:field="*{age}" class="form-control" id="age" required>
                        </div>

                        <div class="mb-3">
                            <label for="gender" class="form-label">Gender</label>
                            <select class="form-select" id="gender" th:field="*{gender}" required>
                                <option value="">Select Gender</option>
                                <option th:value="${T(com.example.Ayurveda_Management.model.Gender).Male}">Male</option>
                                <option th:value="${T(com.example.Ayurveda_Management.model.Gender).Female}">Female</option>
                                <option th:value="${T(com.example.Ayurveda_Management.model.Gender).Other}">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="contact_number" class="form-label">Contact Number</label>
                            <input type="text" th:field="*{contactNumber}" class="form-control" id="contact_number" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" id="email">
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control" th:field="*{address}" id="address" rows="3" ></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="medical_history" class="form-label">Medical History</label>
                            <textarea class="form-control" th:field="*{medicalHistory}" id="medical_history" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="registration_date" class="form-label">Registration Date</label>
                            <input type="date" th:field="*{registrationDate}" class="form-control" id="registration_date" required>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea class="form-control" th:field="*{notes}" id="notes" rows="3"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">Submit</button>

                    </form>
                    <a th:href="@{/patient/list}" class="btn btn-secondary mt-3">Back to Patient List</a>
                </div>



            </div>
        </div>



    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
