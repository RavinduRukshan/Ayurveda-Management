<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">My Profile</h2>

    <div class="card">
        <div class="card-body">
            <p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
            <p><strong>Staff ID:</strong> <span th:text="${user.staff.id}"></span></p>
            <p><strong>Role:</strong> <span th:text="${user.role.authority}"></span></p>
            <p><strong>Status:</strong> <span th:text="${user.status}"></span></p>
            <p><strong>Last Login:</strong> <span th:text="${user.lastLogin != null ? #dates.format(user.lastLogin, 'yyyy-MM-dd HH:mm:ss') : 'N/A'}"></span></p>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/user/list}" class="btn btn-secondary">Back to Home</a>
    </div>
</div>
</body>
</html>
